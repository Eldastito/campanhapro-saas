<head>
<meta charset="UTF-8" />

<title>CampanhaPro — Galáxia 3D · Slides Vivos · Governador</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#04060d;color:#eaf2ff;font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#galaxy{position:fixed;inset:0;z-index:0;pointer-events:none}
.bg-glow{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(60% 55% at 50% 42%,rgba(40,95,210,.16),transparent 70%),radial-gradient(55% 55% at 50% 60%,rgba(58,157,87,.12),transparent 70%)}
.scene{position:fixed;inset:0;z-index:1;display:grid;place-items:center;perspective:2200px;
  cursor:grab;transition:filter .5s,opacity .5s;touch-action:none;user-select:none;-webkit-user-select:none}
.scene.grabbing{cursor:grabbing}.scene.dim{filter:brightness(.4) blur(2px)}
.ring{position:relative;width:300px;height:169px;transform-style:preserve-3d;will-change:transform}
.card{position:absolute;inset:0;transform-style:preserve-3d;transition:filter .45s,opacity .45s}
.card img{width:100%;height:100%;object-fit:cover;border-radius:10px;display:block;border:1px solid rgba(150,190,255,.18);box-shadow:0 14px 50px rgba(0,0,0,.65)}
.card:not(.front){filter:brightness(.45) saturate(.85)}
.card.front{z-index:2}
.card.front img{border-color:rgba(150,200,255,.55);box-shadow:0 0 50px rgba(90,160,255,.45),0 18px 60px rgba(0,0,0,.7)}

.viewer{position:fixed;inset:0;z-index:5;display:grid;place-items:center;opacity:0;pointer-events:none;
  transition:opacity .5s;background:radial-gradient(70% 70% at 50% 50%,rgba(4,7,16,.55),rgba(4,7,16,.85))}
.viewer.open{opacity:1;pointer-events:auto}
.live-wrap{width:min(95vw,calc(92vh * 16 / 9));aspect-ratio:16/9;max-height:92vh;border-radius:10px;overflow:hidden;
  box-shadow:0 40px 110px rgba(0,0,0,.85),0 0 70px rgba(80,140,255,.22);
  transform:scale(.82);opacity:.35;transition:transform .6s cubic-bezier(.16,.84,.28,1),opacity .5s}
.viewer.open .live-wrap{transform:scale(1);opacity:1}
.live-wrap iframe{width:100%;height:100%;border:0;display:block;background:#081424;pointer-events:none}

#progress{position:fixed;top:0;left:0;height:3px;z-index:20;width:0;background:linear-gradient(90deg,#3a9d57,#2f6fd6);box-shadow:0 0 12px #2f6fd6;transition:width .5s}
.hint{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:20;font-family:"JetBrains Mono",monospace;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:#9fb4d4;display:flex;gap:.6rem;align-items:center;transition:opacity .4s;text-align:center}
.hint kbd{border:1px solid rgba(150,180,230,.3);border-radius:5px;padding:1px 7px;color:#cfe0ff;background:rgba(255,255,255,.04)}
.hint.hide{opacity:0}
.title{position:fixed;top:26px;left:0;right:0;z-index:20;text-align:center;pointer-events:none;transition:opacity .5s}
.title.hide{opacity:0}
.title h1{font-family:"Sora";font-weight:800;font-size:clamp(1.1rem,2.4vw,1.7rem);background:linear-gradient(180deg,#fff,#a9c6ee);-webkit-background-clip:text;background-clip:text;color:transparent}
.title p{font-family:"JetBrains Mono";font-size:.64rem;letter-spacing:.3em;text-transform:uppercase;color:#5e74a0;margin-top:.5rem}
.brand{position:fixed;left:22px;bottom:18px;z-index:20;display:flex;align-items:center;gap:.5rem;font-family:"Sora";font-weight:700;font-size:.82rem;opacity:.9}
.brand .dot{width:9px;height:9px;border-radius:50%;background:#3a9d57;box-shadow:0 0 10px #3a9d57}
.counter{position:fixed;right:22px;bottom:16px;z-index:20;font-family:"JetBrains Mono";font-size:.74rem;color:#5e74a0;letter-spacing:.12em}
.counter b{color:#eaf2ff}
.dots{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:20;display:flex;gap:7px;opacity:0;pointer-events:none;transition:opacity .4s}
.dots.show{opacity:1;pointer-events:auto}
.dots button{width:8px;height:8px;border-radius:50%;border:0;cursor:pointer;padding:0;background:rgba(150,180,220,.3);transition:.3s}
.dots button.on{background:#38a0ff;box-shadow:0 0 8px #38a0ff;transform:scale(1.3)}
.ctrl{position:fixed;z-index:21;width:40px;height:40px;border-radius:11px;border:1px solid rgba(150,190,255,.3);background:rgba(10,20,40,.6);color:#9fb4d4;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(6px);transition:.25s}
.ctrl:hover{color:#38a0ff;border-color:#38a0ff;box-shadow:0 0 20px rgba(56,160,255,.35)}
.ctrl svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
#prev{right:70px;bottom:54px}#next{right:22px;bottom:54px}#fs{top:16px;right:22px}
@media(max-width:640px){.ring{width:220px;height:124px}#prev{bottom:48px}}
</style>

const N = THUMBS.length, STEP = 360 / N;
const RADIUS = 150 / Math.tan((STEP/2) * Math.PI/180);
const IDLE_SPEED = 0.06, TILT = -8, DRAG_SPEED = 0.30, DRAG_THRESH = 6, FRICTION = 0.93;

const ring=document.getElementById('ring'), scene=document.getElementById('scene'),
  viewer=document.getElementById('viewer'), live=document.getElementById('live'),
  dotsWrap=document.getElementById('dots'), counter=document.getElementById('counter'),
  hint=document.getElementById('hint'), titleBar=document.getElementById('titleBar'),
  progress=document.getElementById('progress');
  const pauseBtn=document.createElement('button');
  pauseBtn.className='ctrl'; pauseBtn.id='pause'; pauseBtn.title='Pausar (voltar ao carrossel)';
  pauseBtn.style.top='16px'; pauseBtn.style.left='22px'; pauseBtn.style.display='none';
  pauseBtn.innerHTML='<svg viewBox="0 0 24 24"><rect x="7" y="5" width="3.5" height="14" rx="1"/><rect x="13.5" y="5" width="3.5" height="14" rx="1"/></svg>';
  pauseBtn.onclick=(e)=>{ e.stopPropagation(); enterRing(); };
  document.body.appendChild(pauseBtn);

// deck vivo dentro do iframe (pilotado por postMessage)
let frameReady=false, pending=null;
live.addEventListener('load',()=>{ frameReady=true; if(pending!=null){ live.contentWindow.postMessage({goto:pending},'*'); pending=null; } });
live.src = DECK_URL + "#embed&s1";
function liveGoto(i){ if(frameReady) live.contentWindow.postMessage({goto:i},'*'); else pending=i; }

let angle=0, target=0, mode='ring', index=0;
let ringState='auto', velocity=0, down=false, moved=false, startX=0, lastX=0, startY=0, lastY=0;
let clock=0, tiltDrag=0;
const cards=[];

THUMBS.forEach((src,i)=>{
  const card=document.createElement('div'); card.className='card';
  card.style.transform=`rotateY(${i*STEP}deg) translateZ(${RADIUS}px)`;
  const img=document.createElement('img'); img.src=src; img.alt='Slide '+(i+1); img.draggable=false;
  card.appendChild(img); ring.appendChild(card); cards.push(card);
  const b=document.createElement('button'); b.onclick=(e)=>{e.stopPropagation(); jumpTo(i);}; dotsWrap.appendChild(b);
});
const dots=[...dotsWrap.children];

function setFront(i){ cards.forEach((c,k)=>c.classList.toggle('front',k===i)); }
function nearestFront(){ return ((Math.round(-angle/STEP)) % N + N) % N; }
function updateHud(){
  dots.forEach((d,k)=>d.classList.toggle('on',k===index));
  if(mode==='zoom'){ counter.innerHTML='<b>'+String(index+1).padStart(2,'0')+'</b> / '+String(N).padStart(2,'0'); progress.style.width=((index)/(N-1)*100)+'%'; }
  else { counter.textContent='Órbita'; progress.style.width='0%'; }
}
function snapTo(i){ let t=-i*STEP; while(t-angle>180)t-=360; while(t-angle<-180)t+=360; target=t; }
function applyTransform(){ ring.style.transform=`translateZ(-260px) rotateX(${TILT}deg) rotateY(${angle}deg)`; }

function openViewer(i){
  index=i; setFront(i); snapTo(i); liveGoto(i);
  viewer.classList.add('open'); scene.classList.add('dim'); pauseBtn.style.display='grid';
  hint.classList.add('hide'); titleBar.classList.add('hide'); dotsWrap.classList.add('show');
  mode='zoom'; updateHud();
}
function enterRing(){
  viewer.classList.remove('open'); scene.classList.remove('dim','grabbing'); pauseBtn.style.display='none';
  mode='ring'; ringState='auto'; velocity=0; down=false;   // volta a girar; cursor (index) preservado p/ retomar
  titleBar.classList.remove('hide'); hint.classList.remove('hide'); dotsWrap.classList.remove('show'); updateHud();
}
function advance(){
  if(mode==='ring'){ openViewer(index); return; }
  if(index<N-1){ const ni=index+1; viewer.classList.remove('open'); scene.classList.add('dim'); setFront(ni); snapTo(ni); mode='busy'; setTimeout(()=>openViewer(ni),430); }
  else { enterRing(); }
}
function back(){
  if(mode==='busy') return;
  if(mode==='zoom' && index>0){ const pi=index-1; viewer.classList.remove('open'); setFront(pi); snapTo(pi); mode='busy'; setTimeout(()=>openViewer(pi),430); }
  else if(mode==='zoom'){ enterRing(); }
}
function jumpTo(i){
  if(mode==='busy') return;
  if(mode==='zoom'){ viewer.classList.remove('open'); setFront(i); snapTo(i); mode='busy'; setTimeout(()=>openViewer(i),300); }
  else openViewer(i);
}
function toggleFs(){ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }

function loop(){
  clock += 0.005;
  if(mode==='ring'){
    if(ringState==='auto'){ angle += IDLE_SPEED; }                       // giro automático (eixo Y)
    else if(ringState==='inertia'){ angle += velocity; velocity *= FRICTION; if(Math.abs(velocity) < IDLE_SPEED){ ringState='auto'; } }
    if(ringState!=='drag'){ tiltDrag += (0 - tiltDrag) * 0.06; }          // inclinação volta suave ao repouso
    setFront(nearestFront());                                            // realce do slide da frente (decorativo)
  } else {
    angle += (target - angle) * 0.08;                                    // zoom: alinha o anel ao slide
  }
  const tilt = -8 + Math.sin(clock) * 6 + tiltDrag;                      // oscila no eixo X + arraste vertical
  ring.style.transform = `translateZ(-260px) rotateX(${tilt}deg) rotateY(${angle}deg)`;
  requestAnimationFrame(loop);
}
loop(); setFront(0); updateHud();

// navegação
viewer.addEventListener('click', advance);
document.getElementById('next').onclick=(e)=>{e.stopPropagation();advance();};
document.getElementById('prev').onclick=(e)=>{e.stopPropagation();back();};
document.getElementById('fs').onclick=(e)=>{e.stopPropagation();toggleFs();};
scene.addEventListener('pointerdown',(e)=>{ if(mode!=='ring')return; down=true;moved=false;startX=lastX=e.clientX;startY=lastY=e.clientY;velocity=0;ringState='drag';scene.classList.add('grabbing');e.preventDefault(); });
window.addEventListener('pointermove',(e)=>{ if(!down||mode!=='ring')return;
  if(!moved && (Math.abs(e.clientX-startX)>DRAG_THRESH || Math.abs(e.clientY-startY)>DRAG_THRESH)) moved=true;
  if(moved){
    const incX=(e.clientX-lastX)*DRAG_SPEED; angle+=incX; velocity=velocity*0.6+incX*0.4;
    const incY=(e.clientY-lastY); tiltDrag=Math.max(-35,Math.min(35, tiltDrag + incY*0.15));
    lastX=e.clientX; lastY=e.clientY;
  }
});
function endDrag(){ if(!down)return; down=false; scene.classList.remove('grabbing'); if(mode!=='ring')return; if(moved)ringState='inertia'; else advance(); }
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);
addEventListener('keydown',(e)=>{
  if(['ArrowRight',' ','PageDown','Enter'].includes(e.key)){e.preventDefault();advance();}
  else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();back();}
  else if(e.key==='Escape'){ if(mode==='zoom')enterRing(); }
  else if(e.key.toLowerCase()==='f'){ toggleFs(); }
  else if(e.key==='Home'){ index=0; enterRing(); }
});

// galáxia
(function(){
  const c=document.getElementById('galaxy'), x=c.getContext('2d'); let w,h,stars;
  function rs(){ w=c.width=innerWidth; h=c.height=innerHeight; const n=Math.min(220,Math.floor(w*h/9000));
    stars=Array.from({length:n},()=>{ const ang=Math.random()*Math.PI*2, rad=Math.pow(Math.random(),0.7)*Math.min(w,h)*0.62;
      return {ang,rad,sp:(Math.random()*0.0006+0.0002)*(Math.random()<.5?-1:1),r:Math.random()*1.5+0.3,tw:Math.random()*Math.PI*2,
        hue:Math.random()<0.6?214:145,sat:Math.random()<0.82?80:0}; }); }
  rs(); addEventListener('resize',rs);
  function draw(){ x.clearRect(0,0,w,h); const cx=w/2,cy=h/2;
    for(const s of stars){ s.ang+=s.sp; s.tw+=0.03; const px=cx+Math.cos(s.ang)*s.rad, py=cy+Math.sin(s.ang)*s.rad*0.62, a=0.35+Math.sin(s.tw)*0.3;
      x.beginPath(); x.arc(px,py,s.r,0,7); x.fillStyle=s.sat?`hsla(${s.hue},80%,72%,${a})`:`rgba(220,230,255,${a})`; x.fill(); }
    requestAnimationFrame(draw); }
  draw();
})();
</script>
